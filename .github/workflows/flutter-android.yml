name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Csak az android/ mappát generálja – NEM írja felül a lib/ kódot
      - name: Create Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --project-name=zsolt_ai_pro_3 \
              --org=hu.zsoltproai
          else
            echo "android/ already exists, skip create"
          fi

      # Biztonság: ha mégis felülíródott a main, vissza a gitből
      - name: Restore project Dart sources from git
        run: |
          git checkout -- lib/ pubspec.yaml 2>/dev/null || true
          # Ellenőrzés: a mi main.dart-unk legyen
          head -20 lib/main.dart
          grep -q "ZsoltAiProApp\|zsolt" lib/main.dart lib/app.dart && echo "OK: custom app sources present"

      - name: Remove default widget test if present
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSOLT_AI_PRO_3_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
